# Runs the test suite (fake in-memory database — no secrets, never touches Supabase) on every push and PR,
# including the real-browser tests (headless Chromium via Playwright: tests/test_browser.py).
name: Tests

on:
  push:
    branches: [main, "ci/**"]   # ci/* branches: run the tests (e.g. a new migration) before anything reaches main/Render
  pull_request:

# bash with pipefail (GitHub's explicit `shell: bash` = `bash --noprofile --norc -eo pipefail {0}`): a failing pytest
# piped into tee must fail the step (Codex review 6, R6-H01).
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Tests (fake DB + real-browser)
        run: |
          set +e
          python -m pytest -rs | tee out.txt; code=${PIPESTATUS[0]}
          echo "::notice title=tests::$(tail -1 out.txt)"
          grep -E "^(FAILED|ERROR)|^E  " out.txt | head -30 | while read -r l; do echo "::error title=tests::$l"; done
          exit $code
      - name: JavaScript syntax check
        run: for f in static/js/*.js; do node --check "$f"; done

  # The same app against a REAL Postgres + PostgREST: tests/integration/schema.sql (copy of the production schema)
  # + every db/migrations/*.sql, Supabase's roles/grants. Throwaway service container — never production credentials.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PLAYMATE_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PLAYMATE_PGRST_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt "psycopg[binary]==3.2.3"
      - name: Schema + migrations
        run: |
          for f in tests/integration/schema.sql db/migrations/*.sql; do
            echo "== $f"; psql "$PLAYMATE_PG_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Start PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="$PLAYMATE_PG_URL" -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET=test-jwt-secret-that-is-at-least-32-bytes -e PGRST_DB_MAX_ROWS=1000 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          docker logs postgrest
      - name: Integration tests (must not be skipped)
        run: |
          set +e
          python -m pytest tests/test_integration_pg.py -v -rs | tee out.txt; code=${PIPESTATUS[0]}
          echo "::notice title=integration::$(tail -1 out.txt)"
          grep -E "^(FAILED|ERROR)|^E  " out.txt | head -30 | while read -r l; do echo "::error title=integration::$l"; done
          [ "$code" -eq 0 ] && ! grep -q "SKIPPED" out.txt

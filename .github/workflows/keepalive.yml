# Keeps the free Render service awake (it sleeps after ~15 min idle, making the
# first visit take ~50s) and touches the database so Supabase doesn't pause the
# project for inactivity.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (with database check)
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "https://playmate-api-aamc.onrender.com/health?deep=1"

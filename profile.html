<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b10">
  <title>PlayMate | Player profile</title>
  <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/ui.css?v=19">
  <link rel="stylesheet" href="/static/css/profile.css?v=6">
</head>

<body class="profile-page">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2dffb3" />
        <stop offset="1" stop-color="#2ee6ff" />
      </linearGradient>
    </defs>
    <symbol id="i-logo" viewBox="0 0 32 32">
      <path d="M9 27V7.5A2.5 2.5 0 0 1 11.5 5H18a7 7 0 0 1 0 14h-5" fill="none" stroke="url(#brandGrad)" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round" />
      <path d="M14 11h3.5a2 2 0 0 1 0 4H14" fill="none" stroke="url(#brandGrad)" stroke-width="2.6" stroke-linecap="round" />
      <circle cx="9" cy="27" r="2.4" fill="#2dffb3" />
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z" /><path d="M8 9h8M8 12h5" /></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><circle cx="17" cy="9" r="2.8" /><path d="M16 14.2a5 5 0 0 1 5.5 5.8" /></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" /><path d="m13 7 4 4" /></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="6" r="2.5" /><circle cx="18" cy="18" r="2.5" /><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6" /></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="m21 17-5-5-9 8" /></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="m10 8 6 4-6 4z" /></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" /></symbol>
    <symbol id="i-twitch" viewBox="0 0 24 24"><path d="M5 3h15v10l-4 4h-4l-3 3H7v-3H4V6z" /><path d="M11 7v4M15 7v4" /></symbol>
    <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4" /><path d="m10 9 5 3-5 3z" /></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><path d="M17.5 6.5h.01" /></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="/app"><svg class="brand-mark">
        <use href="#i-logo" />
      </svg><span>PlayMate</span></a>
    <nav class="topnav" aria-label="Main">
      <a class="topnav-link" href="/app">Find squad</a>
      <a class="topnav-link" id="nav-my-profile" href="#">My profile</a>
      <a class="topnav-link" id="nav-settings" href="/settings" hidden>Settings</a>
    </nav>
    <div class="topbar-right">
      <a class="btn-logout" id="nav-cta" href="/">Join PlayMate</a>
    </div>
  </header>

  <main class="pp-wrap" id="pp-main">
    <div class="pp-loading" id="pp-loading">
      <div class="scan-pulse"></div>
      <p>Loading profile…</p>
    </div>
  </main>

  <!-- edit drawer (owner only) -->
  <div class="modal-overlay" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="edit-modal">
      <button class="modal-close" type="button" id="edit-close" aria-label="Close">×</button>
      <h2 class="edit-title" id="edit-title">Edit profile</h2>

      <section class="edit-section">
        <h3>Avatar</h3>
        <div class="avatar-pick" id="avatar-pick"></div>
      </section>

      <section class="edit-section">
        <h3>Banner</h3>
        <div class="banner-pick" id="banner-pick"></div>
      </section>

      <section class="edit-section">
        <h3>About me <span class="field-hint" id="bio-count">0/280</span></h3>
        <textarea id="edit-bio" maxlength="280" rows="3" aria-label="About me"
          placeholder="How do you play? e.g. Chill Persian squad player, mostly evenings, love Breakthrough."></textarea>
      </section>

      <section class="edit-section">
        <h3>Links <span class="field-hint">(shown on your profile)</span></h3>
        <div class="links-grid">
          <label><svg class="icon">
              <use href="#i-twitch" />
            </svg><input type="text" id="link-twitch" maxlength="40" placeholder="Twitch name"></label>
          <label><svg class="icon">
              <use href="#i-youtube" />
            </svg><input type="text" id="link-youtube" maxlength="40" placeholder="YouTube @handle"></label>
          <label><svg class="icon">
              <use href="#i-instagram" />
            </svg><input type="text" id="link-instagram" maxlength="40" placeholder="Instagram handle"></label>
        </div>
      </section>

      <div class="edit-actions">
        <button type="button" class="btn-secondary" id="edit-cancel">Cancel</button>
        <button type="button" class="btn-primary" id="edit-save">Save profile</button>
      </div>

      <p class="edit-settings-link"><a href="/settings">Account settings →</a> log out, blocked players, delete account</p>
    </div>
  </div>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
  <script src="/static/js/profile.js?v=13"></script>
</body>

</html>
